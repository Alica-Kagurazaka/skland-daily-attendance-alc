
name: Sync Upstream

on:
  schedule:
    # 每天 UTC 时间凌晨 2 点执行
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/AEtherside/skland-daily-attendance.git

      - name: Fetch upstream
        run: |
          git fetch upstream main

      - name: Merge upstream
        run: |
          git merge --no-edit upstream/main

      - name: Push changes
        run: |
          git push origin main
